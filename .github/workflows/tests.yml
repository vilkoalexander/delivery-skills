name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash hooks/guard.test.sh
      - run: bash skills/delivery-pipeline/scripts/risk-content.test.sh
